name: Check locked dependencies
on:
  push:
    branches: [audit/elia-dependency-check-20261126]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm audit --package-lock-only --json
